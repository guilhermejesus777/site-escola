tspan x="1520" y="999.9999999999999">disciplina e datas</tspan></text><rect x="1340" y="1078" width="360" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="1520" y="1105.6">Anexar arquivos</tspan><tspan x="1520" y="1130">(opcional)</tspan></text><rect x="1310" y="1208" width="420" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="1520" y="1235.6">Salvar atividade</tspan><tspan x="1520" y="1260">no banco PostgreSQL</tspan></text><rect x="1330" y="1338" width="380" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="1520" y="1365.6">Publicar na agenda</tspan><tspan x="1520" y="1390">das turmas</tspan></text><rect x="1350" y="1470" width="340" height="60" rx="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="1520" y="1507.46">Fim: atividade publicada</tspan></text><path d="M1000,170 L1000,208" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1000,272 L1000,320" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M810,380 L280,380 L280,485" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/><g><rect x="511" y="347" width="68" height="26" rx="6" fill="#ffffff" opacity="0.95"/><text x="545" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Aluno</text></g><path d="M1000,440 L1000,508" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#arro