<text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Fluxograma 2 — Reservas de espaços e atividades</text><text x="60" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#64748b">Agenda Escolar · Colégio Estadual Presidente Kennedy</text><rect x="900" y="110" width="200" height="60" rx="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="1000" y="147.46">Início</tspan></text><rect x="790" y="208" width="420" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="1000" y="235.60000000000002">Acessar o sistema</tspan><tspan x="1000" y="260">com sessão iniciada</tspan></text><polygon points="1000,320 1190,380 1000,440 810,380" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="1000" y="387.46">Qual é o perfil?</tspan></text><rect x="70" y="485" width="420" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="280" y="515.6">Visualizar reservas e</tspan><tspan x="280" y="540">atividades</tspan></text><rect x="90" y="618" width="380" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="280" y="645.5999999999999">Consultar detalhes</tspan><tspan x="280" y="669.9999999999999">(somente leitura)</tspan></text><rect x="130" y="760" width="300" height="60" rx="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="280" y="797.46">Fim: consulta realizada</tspan></text><rect x="820" y="508" width="360" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="1000" y="547.8">Abrir o menu do sistema</tspan></text><polygon points="1000,625 1200,690 1000,755 800,690" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="1000" y="697.46">O que deseja fazer?</tspan></text><rect x="360" y="818" width="400" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="560" y="845.5999999999999">Selecionar espaço, data</tspan><tspan x="560" y="869.9999999999999">e horário</tspan></text><polygon points="560,935 780,1010 560,1085 340,1010" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"><tspan x="560" y="1005.87">Horário livre, futuro</tspan><tspan x="560" y="1029.05">e não bloqueado?</tspan></text><rect x="30" y="1125" width="280" height="70" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1e293b"><tspan x="170" y="1155.6">Mostrar aviso de</tspan><tspan x="170" y="1180">conflito ou bloqueio</tspan></text><rect x="10" y="1270" width="320" height="60" rx="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1e293b"