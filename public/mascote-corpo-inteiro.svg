<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Mascote do Colégio Kennedy de corpo inteiro">
  <defs>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c1cb"/>
      <stop offset="1" stop-color="#8b98a6"/>
    </linearGradient>
    <linearGradient id="camisa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b17"/>
      <stop offset="1" stop-color="#0a0d0a"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee62a"/>
      <stop offset="1" stop-color="#5cc513"/>
    </linearGradient>
  </defs>

  <!-- rabo -->
  <path d="M120 430c-40 4-72 26-82 58-6 21 10 33 27 24 22-12 36-38 66-46z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M47 505c8-14 20-24 36-31 4 10 2 20-7 27-10 8-21 10-29 4z" fill="#d7dee5"/>

  <!-- pernas -->
  <path d="M138 452h42v128h-42z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4"/>
  <path d="M190 452h42v128h-42z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4"/>

  <!-- tênis -->
  <path d="M128 570h56c8 0 12 6 12 14v16c0 6-4 10-10 10h-58c-7 0-11-5-9-12l3-16c1-7 2-12 6-12z" fill="#111814" stroke="#4b5561" stroke-width="4"/>
  <path d="M131 584h58" stroke="#5cc513" stroke-width="6" stroke-linecap="round"/>
  <path d="M196 570h56c4 0 5 5 6 12l3 16c2 7-2 12-9 12h-58c-6 0-10-4-10-10v-16c0-8 4-14 12-14z" fill="#111814" stroke="#4b5561" stroke-width="4"/>
  <path d="M199 584h58" stroke="#5cc513" stroke-width="6" stroke-linecap="round"/>

  <!-- shorts -->
  <path d="M118 392h124v72c0 8-6 12-14 12h-32l-12-30-12 30h-32c-8 0-22-4-22-12z" fill="#0d120f" stroke="#3d4a40" stroke-width="4"/>
  <path d="M128 398h16v70h-16z" fill="url(#verde)" opacity=".9"/>
  <path d="M216 398h16v70h-16z" fill="url(#verde)" opacity=".9"/>
  <path d="M180 402v30" stroke="#3d4a40" stroke-width="4"/>

  <!-- pescoço -->
  <path d="M148 214h64v70h-64z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4"/>

  <!-- tronco / camisa -->
  <path d="M132 258h96c20 0 34 14 38 34l12 62c4 22-8 40-30 44l-58 8-58-8c-22-4-34-22-30-44l12-62c4-20 18-34 38-34z" fill="url(#camisa)" stroke="#3d4a40" stroke-width="4"/>
  <!-- mangas verdes -->
  <path d="M132 262l-30 18c-12 8-16 22-12 34l8 24 34-12z" fill="url(#verde)" stroke="#2f9b12" stroke-width="3"/>
  <path d="M228 262l30 18c12 8 16 22 12 34l-8 24-34-12z" fill="url(#verde)" stroke="#2f9b12" stroke-width="3"/>
  <!-- escrita CEPK -->
  <text x="180" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="url(#verde)" letter-spacing="2">CEPK</text>
  <text x="180" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#9be86a" letter-spacing="1.4">CORPO ESTUDANTIL</text>

  <!-- braço direito (mão na cintura) -->
  <path d="M262 296c16 8 26 22 30 40l10 52-30 8-14-54z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M270 392c12 2 20 8 22 16l-24 10-10-20z" fill="#b7c1cb" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>

  <!-- braço esquerdo com joinha -->
  <path d="M102 296c-14 6-24 18-28 34l-14 50 30 8 18-52z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M74 372c-2 18 4 30 16 34l10-24-12-26z" fill="#b7c1cb" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <!-- mão -->
  <path d="M78 286c-8 0-14 6-14 14v22c0 10 6 16 14 16s14-6 14-16v-8l10-6c5-3 5-10 0-13l-10-5c-2-3-6-4-9-4z" fill="#c3ccd5" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M80 278c6-8 16-8 18 0 2 6-2 12-8 14l-12-4z" fill="#c3ccd5" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>

  <!-- orelhas -->
  <path d="M120 96L108 32l54 34z" fill="#8b98a6" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M124 88l-7-38 32 22z" fill="#d9a6a6"/>
  <path d="M240 96l12-64-54 34z" fill="#8b98a6" stroke="#4b5561" stroke-width="4" stroke-linejoin="round"/>
  <path d="M236 88l7-38-32 22z" fill="#d9a6a6"/>

  <!-- cabeça -->
  <path d="M108 108c0-38 30-62 72-62s72 24 72 62v52c0 44-32 74-72 74s-72-30-72-74z" fill="url(#pelo)" stroke="#4b5561" stroke-width="4"/>
  <!-- topo mais claro -->
  <path d="M116 126c4-30 30-48 64-48s60 18 64 48c-16-10-38-16-64-16s-48 6-64 16z" fill="#c3ccd5" opacity=".7"/>
  <!-- focinho -->
  <ellipse cx="180" cy="196" rx="52" ry="40" fill="#e9eef3" stroke="#4b5561" stroke-width="4"/>
  <!-- manchas ao redor dos olhos -->
  <ellipse cx="142" cy="156" rx="20" ry="24" fill="#aab6c2" opacity=".7"/>
  <ellipse cx="218" cy="156" rx="20" ry="24" fill="#aab6c2" opacity=".7"/>
  <!-- olhos -->
  <ellipse cx="142" cy="154" rx="12" ry="14" fill="#ffffff" stroke="#4b5561" stroke-width="3"/>
  <ellipse cx="218" cy="154" rx="12" ry="14" fill="#ffffff" stroke="#4b5561" stroke-width="3"/>
  <circle cx="144" cy="156" r="7" fill="#0a0d0a"/>
  <circle cx="216" cy="156" r="7" fill="#0a0d0a"/>
  <circle cx="146.5" cy="153" r="2.4" fill="#ffffff"/>
  <circle cx="218.5" cy="153" r="2.4" fill="#ffffff"/>
  <!-- sobrancelhas -->
  <path d="M129 132c8-5 18-5 26-1" stroke="#4b5561" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M205 131c8-4 18-4 26 1" stroke="#4b5561" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- nariz -->
  <ellipse cx="180" cy="186" rx="14" ry="10" fill="#0a0d0a"/>
  <ellipse cx="175" cy="183" rx="4" ry="2.5" fill="#5b6672"/>
  <!-- sorriso -->
  <path d="M150 208c10 14 19 20 30 20s20-6 30-20" stroke="#0a0d0a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M163 224c5 5 10 8 17 8s12-3 17-8" stroke="#c2555f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="180" cy="228" rx="9" ry="5" fill="#c2555f"/>

  <!-- boné -->
  <path d="M110 100c0-34 26-56 70-56s70 22 70 56l-6 16c-18-12-40-18-64-18s-46 6-64 18z" fill="url(#verde)" stroke="#2f9b12" stroke-width="4" stroke-linejoin="round"/>
  <!-- aba -->
  <path d="M96 106c10-4 22-6 34-7l4 14c-14 1-27 4-38 8z" fill="#3fae0f" stroke="#2f9b12" stroke-width="4" stroke-linejoin="round"/>
  <!-- frente branca -->
  <path d="M134 56c10-8 26-12 46-12s36 4 46 12c8 6 12 16 12 26 0 8-2 16-6 22-14-10-32-15-52-15s-38 5-52 15c-4-6-6-14-6-22 0-10 4-20 12-26z" fill="#f8fafc" stroke="#d5dde5" stroke-width="3"/>
  <text x="180" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#2f9b12" letter-spacing="2">CEPK</text>
  <text x="180" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="700" fill="#5b6672" letter-spacing=".6">CORPO ESTUDANTIL</text>

  <!-- confetes verdes -->
  <rect x="52" y="150" width="14" height="7" rx="2" fill="#5cc513" opacity=".85" transform="rotate(-28 52 150)"/>
  <rect x="296" y="120" width="14" height="7" rx="2" fill="#5cc513" opacity=".85" transform="rotate(24 296 120)"/>
  <rect x="44" y="300" width="12" height="6" rx="2" fill="#7ee62a" opacity=".7" transform="rotate(18 44 300)"/>
  <rect x="306" y="330" width="12" height="6" rx="2" fill="#7ee62a" opacity=".7" transform="rotate(-16 306 330)"/>
</svg>
